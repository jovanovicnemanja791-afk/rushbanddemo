<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Galerija – Rush Band</title>
<link rel="icon" href="assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth;width:100%;overflow-x:hidden}body{margin:0;width:100%;background:#f4f3ef;font-family:'Archivo',sans-serif}
a{color:#0d0d0e;text-decoration:none}*{box-sizing:border-box}
@media(max-width:820px){.gt{grid-template-columns:repeat(4,minmax(0,1fr))!important}.gp{padding:110px 16px 56px!important}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</helmet>
<div style="background:#f4f3ef;color:#0d0d0e;font-family:'Archivo',sans-serif;min-height:100vh;overflow-x:hidden">
<header style="position:fixed;top:14px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 16px">
<div style="width:100%;max-width:1020px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 14px;background:rgba(40,40,44,.85);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:22px;color:#fff">
<a href="index.html" style="display:flex"><img src="assets/logo.png" alt="Rush Band" style="width:64px;height:64px;margin:-8px 0;object-fit:cover;border-radius:50%"></a>
<a href="index.html" style="display:flex;align-items:center;gap:8px;background:#c6e22a;color:#0d0d0e;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;border-radius:999px;white-space:nowrap" style-hover="background:#fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Nazad na sajt</a>
</div>
</header>
<main class="gp" style="max-width:none;margin:0;padding:150px clamp(20px,4vw,64px) 90px">
<div style="color:rgba(13,13,14,.6);font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase">Galerija</div>
<h1 style="margin:16px 0 40px;font-size:clamp(40px,7vw,84px);font-weight:900;line-height:1;letter-spacing:-.03em">Slike sa nastupa</h1>
<div style="position:relative;width:100%;max-width:640px;margin:0 auto;height:clamp(340px,60vh,600px);border-radius:20px;overflow:hidden;background:#0d0d0e">
<img src="{{ curSrc }}" alt="" style="position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(36px) brightness(.5) saturate(1.1)">
<img src="{{ curSrc }}" alt="Rush Band {{ curN }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">
<button type="button" onClick="{{ prev }}" aria-label="Prethodna" style="position:absolute;top:50%;left:16px;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(13,13,14,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(8px);z-index:2" style-hover="background:#c6e22a;color:#0d0d0e;border-color:#c6e22a"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" onClick="{{ next }}" aria-label="Sledeća" style="position:absolute;top:50%;right:16px;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(13,13,14,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(8px);z-index:2" style-hover="background:#c6e22a;color:#0d0d0e;border-color:#c6e22a"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div style="position:absolute;left:18px;bottom:16px;color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em;background:rgba(13,13,14,.55);padding:8px 14px;border-radius:999px;z-index:2">{{ curN }} / {{ total }}</div>
</div>
<div class="gt" style="max-width:640px;margin:14px auto 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:4px">
<sc-for list="{{ photos }}" as="p" hint-placeholder-count="8">
<button type="button" onClick="{{ p.open }}" aria-label="Fotografija {{ p.n }}" style="width:100%;aspect-ratio:1/1;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:pointer;background:#1c1c1f;opacity:{{ p.op }};outline:3px solid {{ p.oc }};outline-offset:2px;transition:opacity .2s,outline-color .2s" style-hover="opacity:1"><img src="{{ p.src }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></button>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cur: 0 };
  P = ["assets/gallery-1.png","assets/gallery-2.jpg","assets/gallery-3.jpg","assets/gallery-4.jpg","assets/gallery-5.jpg","assets/gallery-6.jpg","assets/gallery-7.jpg","assets/gallery-8.jpg","assets/gallery-9.jpg","assets/gallery-10.jpg","assets/gallery-11.jpg","assets/gallery-12.jpg","assets/gallery-13.jpg","assets/gallery-14.jpg","assets/gallery-15.jpg","assets/gallery-16.jpg","assets/gallery-17.jpg"];
  componentDidMount() {
    this._k = e => { if (e.key === "ArrowRight") this.go(1); if (e.key === "ArrowLeft") this.go(-1); };
    window.addEventListener("keydown", this._k);
    this._tx = 0;
    this._ts = e => { this._tx = e.touches[0].clientX; };
    this._te = e => { const d = e.changedTouches[0].clientX - this._tx; if (Math.abs(d) > 50) this.go(d < 0 ? 1 : -1); };
    window.addEventListener("touchstart", this._ts, { passive: true }); window.addEventListener("touchend", this._te, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener("keydown", this._k); window.removeEventListener("touchstart", this._ts); window.removeEventListener("touchend", this._te); }
  go(d) { this.setState(s => ({ cur: (s.cur + d + this.P.length) % this.P.length })); }
  renderVals() {
    const c = this.state.cur;
    return {
      photos: this.P.map((src, i) => ({ src, n: i + 1, op: i === c ? 1 : 0.5, oc: i === c ? "#c6e22a" : "transparent", open: () => this.setState({ cur: i }) })),
      curSrc: this.P[c], curN: c + 1, total: this.P.length,
      prev: () => this.go(-1), next: () => this.go(1)
    };
  }
}
</script>
</body>
</html>
